name: 🛠️ Verbesserung / Improvement
description: Schlage eine Verbesserung für eine bestehende Funktion vor. / Suggest an improvement to an existing feature.
title: "[IMPROVEMENT] "
labels:
  - improvement
body:
  - type: markdown
    attributes:
      value: |
        ## 🛠️ Verbesserung / Improvement

        🇩🇪 Danke für deinen Verbesserungsvorschlag! Dieses Template ist für bereits vorhandene Funktionen.
        🇬🇧 Thanks for your improvement suggestion! This template is for features that already exist.

  - type: textarea
    id: current
    attributes:
      label: 📌 Aktuelles Verhalten / Current behavior
      description: Wie funktioniert die Funktion aktuell? / How does the feature currently work?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: ❗ Was könnte verbessert werden? / What could be improved?
      description: Was stört dich an der aktuellen Umsetzung? / What bothers you about the current implementation?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 💡 Verbesserungsvorschlag / Suggested improvement
      description: Wie sollte die Funktion verbessert werden? / How should the feature be improved?
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: 🎯 Vorteil / Benefit
      description: Welchen Vorteil hätte die Änderung? / What would be the benefit of the change?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 📦 Bereich / Area
      description: Welcher Bereich soll verbessert werden? / Which area should be improved?
      options:
        - Ticket-System / Tickets
        - Moderation
        - Verifizierung / Verification
        - Dashboard
        - Weboberfläche / Web interface
        - Benachrichtigungen / Notifications
        - Server-Konfiguration / Server configuration
        - Discord-Integration / Discord integration
        - Performance
        - Sonstiges / Other
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: ✨ Beispiel / Example
      description: Zeig uns Vorher/Nachher, wenn möglich. / Show us before/after if possible.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 📎 Weitere Informationen / Additional information
      description: Screenshots, Videos oder weitere Details. / Screenshots, videos, or more details.
    validations:
      required: false
