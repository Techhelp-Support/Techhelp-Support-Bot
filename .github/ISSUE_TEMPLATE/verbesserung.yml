name: 🛠️ Verbesserung
description: Schlage eine Verbesserung für eine bereits vorhandene Funktion vor.
title: "[IMPROVEMENT] "
labels:
  - improvement
body:
  - type: markdown
    attributes:
      value: |
        ## 🛠️ Verbesserung

        Danke für deinen Verbesserungsvorschlag! 🚀

        Dieses Template ist für Funktionen gedacht, die bereits im TechHelp Support Bot existieren und verbessert werden könnten.

  - type: textarea
    id: current
    attributes:
      label: 📌 Aktuelles Verhalten
      description: Wie funktioniert die Funktion aktuell?
      placeholder: |
        Aktuell funktioniert die Funktion so, dass ...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: ❗ Was könnte verbessert werden?
      description: Was stört dich an der aktuellen Umsetzung?
      placeholder: |
        Die aktuelle Umsetzung könnte verbessert werden, weil ...
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 💡 Verbesserungsvorschlag
      description: Wie sollte die Funktion deiner Meinung nach verbessert werden?
      placeholder: |
        Ich würde vorschlagen, dass ...
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: 🎯 Vorteil der Verbesserung
      description: Welchen Vorteil hätte die Änderung?
      placeholder: |
        Dadurch könnten Nutzer ...
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 📦 Bereich
      description: Welcher Bereich soll verbessert werden?
      options:
        - Ticket-System
        - Moderation
        - Verifizierung
        - Dashboard
        - Weboberfläche
        - Benachrichtigungen
        - Server-Konfiguration
        - Discord-Integration
        - Performance
        - Sonstiges
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: ✨ Beispiel
      description: Zeige uns gerne anhand eines Beispiels, wie es besser funktionieren könnte.
      placeholder: |
        Vorher:
        ...

        Nachher:
        ...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 📎 Weitere Informationen
      description: Gibt es noch Screenshots, Videos oder weitere Informationen?
      placeholder: |
        Weitere Informationen ...
    validations:
      required: false
