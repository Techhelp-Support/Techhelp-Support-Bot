name: 🐛 Fehler melden / Bug report
description: Melde einen Fehler oder Defekt. / Report a bug or defect.
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Fehler melden / Bug report

        🇩🇪 Danke, dass du einen Fehler meldest! Bitte fülle die Felder so vollständig wie möglich aus.
        🇬🇧 Thanks for reporting a bug! Please fill in the fields as completely as possible.

  - type: checkboxes
    id: checks
    attributes:
      label: ✅ Vorab-Checks / Pre-checks
      options:
        - label: Ich habe nach ähnlichen Issues gesucht. / I searched for similar issues.
          required: true
        - label: Ich habe keine sensiblen Daten (Tokens, Passwörter) enthalten. / I have not included sensitive data (tokens, passwords).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 🔴 Problem
      description: Beschreibe das Problem kurz. / Briefly describe the problem.
      placeholder: |
        Der Bot ... / The bot ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 Reproduktionsschritte / Steps to reproduce
      description: Wie kann der Fehler ausgelöst werden? / How can the bug be triggered?
      placeholder: |
        1. Dashboard öffnen / Open the dashboard
        2. Server auswählen / Select a server
        3. Fehler tritt auf / The error occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Erwartetes Verhalten / Expected behavior
      description: Was sollte passieren? / What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ Tatsächliches Verhalten / Actual behavior
      description: Was passiert stattdessen? / What happens instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 📦 Bereich / Area
      description: Wo tritt der Fehler auf? / Where does the bug occur?
      options:
        - Ticket-System / Tickets
        - Moderation
        - Verifizierung / Verification
        - Dashboard
        - Weboberfläche / Web interface
        - Benachrichtigungen / Notifications
        - Server-Konfiguration / Server configuration
        - Discord-Integration / Discord integration
        - Performance
        - Sonstiges / Other
    validations:
      required: true

  - type: input
    id: bot-version
    attributes:
      label: 🤖 Bot-Version
      description: Welche Version nutzt du? / Which version do you use?
      placeholder: "z. B. / e.g. v1.2.3"

  - type: input
    id: environment
    attributes:
      label: 💻 Umgebung / Environment
      description: Browser, OS oder Discord-Client. / Browser, OS, or Discord client.
      placeholder: "z. B. / e.g. Chrome 120, Windows 11"

  - type: textarea
    id: screenshots
    attributes:
      label: 📎 Screenshots / Logs
      description: Keine sensiblen Daten teilen. / Do not share sensitive data.

  - type: textarea
    id: additional
    attributes:
      label: 💬 Zusätzliche Informationen / Additional information
