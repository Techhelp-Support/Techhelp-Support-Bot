name: 💡 Neue Idee / New idea
description: Schlage eine neue Funktion vor. / Suggest a completely new feature.
title: "[IDEA] "
labels:
  - idea
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Neue Idee / New idea

        🇩🇪 Danke für deinen Vorschlag! Beschreibe deine Idee bitte möglichst genau.
        🇬🇧 Thanks for your suggestion! Please describe your idea as clearly as possible.

  - type: textarea
    id: idea
    attributes:
      label: 💡 Deine Idee / Your idea
      description: Was möchtest du hinzufügen? / What would you like to add?
      placeholder: |
        Ich wünsche mir eine Funktion, mit der ... / I'd love a feature that ...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 🎯 Problem
      description: Welches Problem soll gelöst werden? / What problem should it solve?
      placeholder: |
        Aktuell ist es schwierig, weil ... / Currently it's difficult because ...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: ⚙️ Funktionsweise / How should it work?
      description: Wie stellst du dir die Umsetzung vor? / How do you imagine it working?
    validations:
      required: false

  - type: textarea
    id: example
    attributes:
      label: ✨ Beispiel / Example
      description: Wie könnte die Funktion verwendet werden? / How could the feature be used?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 📦 Bereich / Area
      description: Für welchen Bereich ist die Idee gedacht? / Which area is the idea for?
      options:
        - Ticket-System / Tickets
        - Moderation
        - Verifizierung / Verification
        - Dashboard
        - Weboberfläche / Web interface
        - Benachrichtigungen / Notifications
        - Server-Konfiguration / Server configuration
        - Discord-Integration / Discord integration
        - Performance
        - Sonstiges / Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 📎 Weitere Informationen / Additional information
      description: Screenshots, Beispiele oder weitere Details. / Screenshots, examples, or more details.
    validations:
      required: false
