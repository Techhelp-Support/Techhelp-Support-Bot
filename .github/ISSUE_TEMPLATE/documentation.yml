name: 📚 Dokumentation / Documentation
description: Verbesserung oder Korrektur der Dokumentation. / Improve or fix the documentation.
title: "[DOCS] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        ## 📚 Dokumentation / Documentation

        🇩🇪 Danke für deinen Beitrag zur Dokumentation! Gute Doku hilft der ganzen Community.
        🇬🇧 Thanks for contributing to the docs! Good documentation helps the whole community.

  - type: textarea
    id: issue
    attributes:
      label: 📄 Problem
      description: Welcher Abschnitt ist unklar, falsch oder unvollständig? / Which section is unclear, wrong, or incomplete?
      placeholder: |
        Die Anleitung zu ... ist unklar. / The guide on ... is unclear.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: 💡 Vorschlag / Suggestion
      description: Wie sollte die Doku verbessert werden? / How should the docs be improved?
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 📍 Betroffene Stelle / Affected location
      description: Datei oder Abschnitt. / File or section.
      placeholder: "z. B. / e.g. README.md, CONTRIBUTING.md, docs/"

  - type: textarea
    id: additional
    attributes:
      label: 📎 Zusätzliche Hinweise / Additional notes
