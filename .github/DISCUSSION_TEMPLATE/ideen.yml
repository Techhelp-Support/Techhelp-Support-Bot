title: "[Idee / Idea] "
labels:
  - idea
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Ideen-Austausch / Idea exchange

        🇩🇪 Diskutiere deine Idee locker mit der Community, bevor daraus ein Issue wird.
        🇬🇧 Discuss your idea casually with the community before it becomes an issue.

  - type: textarea
    id: idea
    attributes:
      label: Deine Idee / Your idea
      description: Was schwebt dir vor? / What do you have in mind?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Hintergrund / Background
      description: Warum wäre das hilfreich? / Why would this be helpful?
    validations:
      required: false
