title: "[Frage / Question] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        ## 🙋 Fragen & Hilfe / Q&A

        🇩🇪 Stell deine Frage – die Community und das Team helfen gerne! Schau kurz, ob sie schon beantwortet wurde.
        🇬🇧 Ask your question – the community and the team are happy to help! Check whether it's already answered.

  - type: textarea
    id: question
    attributes:
      label: Deine Frage / Your question
      description: Was möchtest du wissen? / What would you like to know?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Bereich / Area
      description: Worum geht es? / What is it about?
      options:
        - Ticket-System / Tickets
        - Moderation
        - Verifizierung / Verification
        - Dashboard
        - Weboberfläche / Web interface
        - Server-Konfiguration / Server configuration
        - Discord-Integration / Discord integration
        - Sonstiges / Other
    validations:
      required: false

  - type: textarea
    id: tried
    attributes:
      label: Was hast du schon versucht? / What have you tried?
    validations:
      required: false
