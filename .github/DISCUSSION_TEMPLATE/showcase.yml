title: "[Showcase] "
labels:
  - showcase
body:
  - type: markdown
    attributes:
      value: |
        ## 🎉 Showcase

        🇩🇪 Zeig der Community, was du mit dem Bot gebaut oder eingerichtet hast!
        🇬🇧 Show the community what you've built or set up with the bot!

  - type: textarea
    id: what
    attributes:
      label: Was hast du gebaut? / What did you build?
      description: Beschreibe kurz, was du zeigen möchtest. / Briefly describe what you want to show.
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: Wie funktioniert es? / How does it work?
      description: Gerne mit Details. / Details welcome.
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshots / Medien / Media
      description: Zeig es uns! / Show us!
    validations:
      required: false
