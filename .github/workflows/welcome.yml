name: 👋 Willkommen

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Willkommensnachricht für neue Beiträge
        uses: actions/github-script@v7
        with:
          script: |
            const isIssue = !!context.payload.issue;
            const isFirstTimer = (context.payload.issue || context.payload.pull_request)
              .author_association === 'FIRST_TIME_CONTRIBUTOR'
              || (context.payload.issue || context.payload.pull_request)
              .author_association === 'FIRST_TIMER';

            const number = isIssue
              ? context.payload.issue.number
              : context.payload.pull_request.number;

            const issueBody = [
              '👋 **🇩🇪 Deutsch**',
              '',
              'Danke für dein Issue und willkommen in der **TechHelp Support Bot** Community! Das Team schaut es sich an.',
              '- 💬 Für allgemeine Fragen sind die [Discussions](https://github.com/Techhelp-Support/Techhelp-Support-Bot/discussions) der beste Ort.',
              '- 🔎 Bitte prüfe, ob es bereits ein ähnliches Issue gibt.',
              '- 👍 Reagiere gerne auf andere Issues, um zu zeigen, was dir wichtig ist.',
              '',
              '---',
              '',
              '🇬🇧 **English**',
              '',
              'Thanks for your issue and welcome to the **TechHelp Support Bot** community! The team will take a look.',
              '- 💬 For general questions, [Discussions](https://github.com/Techhelp-Support/Techhelp-Support-Bot/discussions) are the best place.',
              '- 🔎 Please check whether a similar issue already exists.',
              '- 👍 Feel free to react to other issues to show what matters to you.',
              '',
              'Gemeinsam besser. Gemeinsam entwickelt. / Better together. Built together. 💙',
            ].join('\n');

            const prBody = [
              '🎉 **🇩🇪 Deutsch**',
              '',
              'Danke für deinen Pull Request und willkommen in der Community! Ein Maintainer prüft deine Änderungen. Bitte stelle sicher, dass die Checkliste im PR-Template ausgefüllt ist, keine Zugangsdaten enthalten sind und die Doku bei Bedarf angepasst wurde.',
              '',
              '---',
              '',
              '🇬🇧 **English**',
              '',
              'Thanks for your pull request and welcome to the community! A maintainer will review your changes. Please make sure the PR template checklist is complete, no credentials are included, and docs were updated if needed.',
              '',
              'Wir melden uns so schnell wie möglich. / We\'ll get back to you as soon as possible. 💙',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: isIssue ? issueBody : prBody,
            });
