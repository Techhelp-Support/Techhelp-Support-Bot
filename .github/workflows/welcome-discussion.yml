name: 👋 Willkommen (Discussions)

on:
  discussion:
    types: [created]

permissions:
  discussions: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Willkommensnachricht für neue Discussions
        uses: actions/github-script@v7
        with:
          script: |
            const discussion = context.payload.discussion;
            if (!discussion) return;

            const body = [
              '👋 **🇩🇪 Deutsch**',
              '',
              'Danke für deinen Beitrag und willkommen in der **TechHelp Support Bot** Community!',
              '- 🤝 Bitte bleib freundlich und sachlich (siehe Verhaltenskodex).',
              '- 🙋 Bei Fragen (Q&A) markiere gerne die hilfreichste Antwort als Lösung.',
              '- 🐛 Geht es um einen konkreten Fehler oder eine ausgearbeitete Idee? Dann passt ein Issue oft besser.',
              '',
              '---',
              '',
              '🇬🇧 **English**',
              '',
              'Thanks for your post and welcome to the **TechHelp Support Bot** community!',
              '- 🤝 Please stay friendly and constructive (see the Code of Conduct).',
              '- 🙋 In Q&A, feel free to mark the most helpful answer as the solution.',
              '- 🐛 Is it a concrete bug or a fleshed-out idea? An issue is often a better fit.',
              '',
              'Gemeinsam besser. Gemeinsam entwickelt. / Better together. Built together. 💙',
            ].join('\n');

            await github.graphql(
              `mutation($discussionId: ID!, $body: String!) {
                addDiscussionComment(input: { discussionId: $discussionId, body: $body }) {
                  comment { id }
                }
              }`,
              { discussionId: discussion.node_id, body }
            );
