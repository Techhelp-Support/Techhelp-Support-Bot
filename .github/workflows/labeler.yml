name: 🏷️ Auto-Label

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label anhand des Titels setzen
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue.title || '').toLowerCase();
            const labels = new Set();

            if (title.startsWith('[idea]')) labels.add('idea');
            if (title.startsWith('[improvement]')) labels.add('improvement');
            if (title.startsWith('[bug]')) labels.add('bug');
            if (title.startsWith('[docs]')) labels.add('documentation');

            // Bereich anhand von Schlagwörtern
            const areaMap = {
              'ticket': 'area: tickets',
              'moderation': 'area: moderation',
              'verifizierung': 'area: verification',
              'dashboard': 'area: dashboard',
              'performance': 'area: performance',
            };
            for (const [keyword, label] of Object.entries(areaMap)) {
              if (title.includes(keyword)) labels.add(label);
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [...labels],
              });
            }
